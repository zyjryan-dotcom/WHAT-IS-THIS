<!DOCTYPE html>
<html lang="zh">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>中文练习</title>

<style>

body{
    font-family:sans-serif;
    text-align:center;
    background:#f0f4f8;
    padding:20px;
}

button{
    width:300px;
    padding:20px;
    margin:10px;
    border:none;
    border-radius:15px;
    font-size:22px;
    color:white;
}

.blue{
    background:#2196F3;
}

.green{
    background:#4CAF50;
}

.orange{
    background:orange;
}

#result{
    margin:20px;
    font-size:24px;
    color:#ff5722;
}

</style>
</head>

<body>

<h1>中文对话练习</h1>

<button id="question" class="blue">
加载中
</button>

<br>

<button id="answer1" class="green">
---
</button>

<button id="answer2" class="green">
---
</button>

<div id="result"></div>

<button id="next" class="orange">
下一题
</button>

<script>

const data = [

{
q:"这是什么？",
a1:"这是足球",
a2:"这是球"
},

{
q:"这是谁的足球？",
a1:"这是JJ的足球",
a2:"我的足球"
},

{
q:"这是什么？",
a1:"这是花",
a2:"漂亮的花"
}

];

let index = 0;

const question =
document.getElementById("question");

const answer1 =
document.getElementById("answer1");

const answer2 =
document.getElementById("answer2");

const result =
document.getElementById("result");

const next =
document.getElementById("next");

function speak(text){

speechSynthesis.cancel();

const msg =
new SpeechSynthesisUtterance(text);

msg.lang = "zh-CN";

speechSynthesis.speak(msg);

}

function loadQuestion(){

question.innerText =
data[index].q;

answer1.innerText =
data[index].a1;

answer2.innerText =
data[index].a2;

result.innerText = "";

}

question.onclick = function(){

speak(data[index].q);

result.innerText =
"听问题";

};

answer1.onclick = function(){

speak(data[index].a1);

result.innerText =
"你说：" + data[index].a1;

};

answer2.onclick = function(){

speak(data[index].a2);

result.innerText =
"你说：" + data[index].a2;

};

next.onclick = function(){

index++;

if(index >= data.length){

index = 0;

}

loadQuestion();

};

loadQuestion();

</script>

</body>
</html>
