<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中文练习 - 简约版</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background: #f0f4f8;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 激活遮罩层 */
        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(33, 150, 243, 0.95);
            color: white; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer;
        }

        button {
            width: 320px;
            padding: 22px;
            margin: 12px;
            border: none;
            border-radius: 15px;
            font-size: 24px;
            color: white;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        button:active { transform: scale(0.98); }

        .blue { background: #2196F3; }
        .green { background: #4CAF50; }
        .orange { background: #FF9800; }

        #result {
            margin: 25px;
            font-size: 26px;
            font-weight: bold;
            color: #FF5722;
            min-height: 1.2em;
        }

        .label { color: #666; font-size: 14px; margin-bottom: -5px; }
    </style>
</head>
<body>

<!-- 点击这个层来解锁浏览器声音 -->
<div id="start-overlay" onclick="startApp()">
    <h1 style="font-size: 3rem;">点击开始</h1>
    <p>Click to activate Sound</p>
</div>

<h1>中文对话练习</h1>

<p class="label">点击蓝按钮听问题</p>
<button id="question" class="blue">加载中</button>

<br>

<p class="label">点击绿按钮选回答</p>
<button id="answer1" class="green">---</button>
<button id="answer2" class="green">---</button>

<div id="result"></div>

<button id="next" class="orange">下一题 →</button>

<script>
    const data = [
        { q: "这是什么？", a1: "这是足球", a2: "这是球" },
        { q: "这是谁的足球？", a1: "这是JJ的足球", a2: "我的足球" },
        { q: "这是什么？", a1: "这是花", a2: "漂亮的花" }
    ];

    let index = 0;
    const synth = window.speechSynthesis;

    // 获取DOM元素
    const qBtn = document.getElementById("question");
    const a1Btn = document.getElementById("answer1");
    const a2Btn = document.getElementById("answer2");
    const resultDiv = document.getElementById("result");

    // 1. 解锁声音的关键函数
    function startApp() {
        // 创建一个空白语音并播放，以此解锁权限
        const msg = new SpeechSynthesisUtterance("");
        synth.speak(msg);
        
        document.getElementById("start-overlay").style.display = "none";
        loadQuestion();
    }

    // 2. 增强的朗读函数
    function speak(text) {
        // 先取消当前正在读的内容
        synth.cancel();

        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = "zh-CN";
        msg.rate = 0.9; // 语速稍慢，适合练习
        
        // 尝试选择中文语音
        const voices = synth.getVoices();
        const chineseVoice = voices.find(v => v.lang.includes('zh'));
        if (chineseVoice) msg.voice = chineseVoice;

        synth.speak(msg);
    }

    function loadQuestion() {
        const item = data[index];
        qBtn.innerText = item.q;
        a1Btn.innerText = item.a1;
        a2Btn.innerText = item.a2;
        resultDiv.innerText = "";
        
        // 自动朗读新问题
        setTimeout(() => speak(item.q), 300);
    }

    // 事件绑定
    qBtn.onclick = () => {
        speak(data[index].q);
        resultDiv.innerText = "问题： " + data[index].q;
    };

    a1Btn.onclick = () => {
        speak(data[index].a1);
        resultDiv.innerText = "你说：" + data[index].a1;
    };

    a2Btn.onclick = () => {
        speak(data[index].a2);
        resultDiv.innerText = "你说：" + data[index].a2;
    };

    document.getElementById("next").onclick = () => {
        index = (index + 1) % data.length;
        loadQuestion();
    };

    // 预热语音列表（部分浏览器需要）
    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = () => synth.getVoices();
    }
</script>

</body>
</html>
