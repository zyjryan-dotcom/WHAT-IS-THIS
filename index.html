<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>亲子中文对话练习</title>
    <style>
        body { 
            text-align: center; 
            font-size: 24px; 
            font-family: "Microsoft YaHei", sans-serif; 
            padding: 20px; 
            max-width: 800px; 
            margin: 0 auto; 
            background-color: #f7f9fc;
        }
        .question-box {
            background-color: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-top: 20px;
        }
        h2 { color: #2c3e50; display: inline; vertical-align: middle; }
        .speak-q-btn { 
            background: none; 
            border: none; 
            font-size: 28px; 
            cursor: pointer; 
            vertical-align: middle;
            margin-left: 10px;
        }
        .btn-container { margin: 30px 0; }
        button.answer-btn { 
            font-size: 22px; 
            margin: 10px; 
            padding: 15px 30px; 
            border-radius: 15px; 
            cursor: pointer; 
            border: none;
            background-color: #4CAF50; 
            color: white; 
            box-shadow: 0 5px #2e7d32; 
            transition: 0.2s;
        }
        button.answer-btn:active { 
            transform: translateY(3px); 
            box-shadow: 0 2px #2e7d32; 
        }
        #result { 
            margin: 25px 0; 
            min-height: 1.5em; 
            font-weight: bold; 
            color: #ff5722; 
        }
        .control-panel {
            background: #eee;
            padding: 20px;
            border-radius: 15px;
        }
        .action-btn {
            font-size: 20px;
            padding: 12px 25px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            margin: 5px;
            color: white;
        }
        .speak-a-btn { background-color: #2196F3; }
        .next-btn { background-color: #ff9800; }
    </style>
</head>
<body>
    <div class="question-box">
        <h2 id="question">准备好了吗？</h2>
        <button class="speak-q-btn" onclick="speakText(document.getElementById('question').textContent)">🔊</button>
    </div>
    
    <div class="btn-container">
        <button id="btn1" class="answer-btn">---</button>
        <button id="btn2" class="answer-btn">---</button>
    </div>
    
    <p id="result"></p>
    
    <div class="control-panel">
        <button class="action-btn speak-a-btn" onclick="speakSelected()">🔊 读我的回答</button>
        <button class="action-btn next-btn" onclick="next()">下一句 ➡️</button>
    </div>

    <script>
        let data = [
            { q: "这是什么？", a: ["这是足球", "这是球"] },
            { q: "这是谁的足球？", a: ["这是JJ的足球", "我的足球"] },
            { q: "这是什么？", a: ["这是花", "漂亮的花"] },
            { q: "这是谁的花？", a: ["这是Sophia的花", "妈妈的花"] },
            { q: "这是什么？", a: ["这是鞋子", "小鞋子"] },
            { q: "这是谁的鞋子？", a: ["这是妈妈的鞋子", "JJ的鞋子"] },
            { q: "这是什么？", a: ["这是钱", "纸币"] },
            { q: "这是谁的钱？", a: ["这是爸爸和妈妈的钱", "我的钱"] },
            { q: "这是什么？", a: ["这是小狗", "可爱的小狗"] },
            { q: "这是谁的小狗？", a: ["这是Maddie的小狗", "我们的狗狗"] }
        ];

        let index = 0;
        let selected = "";

        const questionEl = document.getElementById("question");
        const resultEl = document.getElementById("result");
        const btn1 = document.getElementById("btn1");
        const btn2 = document.getElementById("btn2");

        // 通用的朗读函数
        function speakText(text) {
            if (!text || text === "---") return;
            speechSynthesis.cancel();
            let msg = new SpeechSynthesisUtterance(text);
            msg.lang = "zh-CN";
            msg.rate = 0.8; 
            speechSynthesis.speak(msg);
        }

        // 朗读学生选中的回答
        function speakSelected() {
            if (!selected) {
                alert("请先选一个回答哦！");
                return;
            }
            speakText(selected);
        }

        function choose(text) {
            selected = text;
            resultEl.innerHTML = `你说：${text}`;
        }

        function updateQuestion() {
            questionEl.textContent = data[index].q;
            btn1.textContent = data[index].a[0];
            btn2.textContent = data[index].a[1];
            resultEl.innerHTML = "";
            selected = "";
        }

        function next() {
            index = (index + 1) % data.length;
            updateQuestion();
        }

        function init() {
            btn1.onclick = () => choose(btn1.textContent);
            btn2.onclick = () => choose(btn2.textContent);
            updateQuestion();
        }

        window.onload = init;
    </script>
</body>
</html>
