<script>
    let data = [
        { q: "这是什么？", a: ["这是足球", "这是球"] },
        { q: "这是谁的足球？", a: ["这是JJ的足球", "我的足球"] },
        { q: "这是什么？", a: ["这是花", "漂亮的花"] },
        { q: "这是谁的花？", a: ["这是Sophia的花", "妈妈的花"] },
        { q: "这是什么？", a: ["这是鞋子", "小鞋子"] },
        { q: "这是谁的鞋子？", a: ["这是妈妈的鞋子", "JJ的鞋子"] },
        { q: "这是什么？", a: ["这是钱", "纸币"] },
        { q: "这是谁的钱？", a: ["这是爸爸和妈妈的钱", "我的钱"] },
        { q: "这是什么？", a: ["这是小狗", "可爱的小狗"] },
        { q: "这是谁的小狗？", a: ["这是Maddie的小狗", "我们的狗狗"] }
    ];

    let index = 0;
    let isStudentAsk = false; // 👉 新增：是否切换“学生提问模式”

    function speak(txt) {
        if (!txt || txt === "---") return;
        window.speechSynthesis.cancel();
        let m = new SpeechSynthesisUtterance(txt);
        m.lang = "zh-CN";
        m.rate = 0.8;
        window.speechSynthesis.speak(m);
    }

    // 👉 点击问题：播放 + 切换“谁在问”
    function speakQuestion() {
        let q = data[index].q;

        if (isStudentAsk) {
            document.getElementById("result").innerText = "👉 请你来问：";
        } else {
            document.getElementById("result").innerText = "👉 听问题：";
        }

        speak(q);
        isStudentAsk = !isStudentAsk; // 👉 每次点击切换角色
    }

    function choose(txt) {
        document.getElementById("result").innerText = "你说：" + txt;
        speak(txt);
    }

    function update() {
        document.getElementById("q-bar").innerText = data[index].q;
        document.getElementById("a1").innerText = data[index].a[0];
        document.getElementById("a2").innerText = data[index].a[1];
        document.getElementById("result").innerText = "";

        // 👉 自动读问题（课堂神器）
        setTimeout(() => speak(data[index].q), 300);
    }

    function next() {
        index = (index + 1) % data.length;
        update();
    }

    window.onload = update;
</script>
