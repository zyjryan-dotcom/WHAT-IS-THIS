<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>亲子中文对话练习</title>
    <style>
        body { 
            text-align: center; 
            font-size: 24px; 
            font-family: "Microsoft YaHei", sans-serif; 
            padding: 20px; 
            max-width: 800px; 
            margin: 0 auto; 
            background-color: #f7f9fc;
        }
        .label { font-size: 16px; color: #7f8c8d; margin-bottom: 5px; margin-top: 15px; }
        
        /* 这里的 bar 就是你想要的长条按钮样式 */
        .bar {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            margin: 10px auto;
            border-radius: 15px;
            border: none;
            cursor: pointer;
            display: block;
            font-size: 24px;
            font-weight: bold;
            transition: 0.2s;
        }

        /* 问题条：蓝色 */
        .question-bar {
            background-color: #2196F3;
            color: white;
            box-shadow: 0 5px #1565C0;
        }
        .question-bar:active { transform: translateY(3px); box-shadow: 0 2px #1565C0; }

        /* 回答条：绿色 */
        .answer-bar {
            background-color: #4CAF50;
            color: white;
            box-shadow: 0 5px #2e7d32;
        }
        .answer-bar:active { transform: translateY(3px); box-shadow: 0 2px #2e7d32; }

        #result { margin: 20px 0; color: #ff5722; font-weight: bold; min-height: 1.5em; }

        /* 下一题：橙色 */
        .next-btn {
            background-color: #ff9800;
            color: white;
            box-shadow: 0 5px #e68a00;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <div class="label">点击蓝条听问题 🔊</div>
    <button id="question-bar" class="bar question-bar" onclick="speak(this.textContent)">
        加载中...
    </button>

    <div class="label">点击绿条选回答 🔊</div>
    <button id="btn1" class="bar answer-bar" onclick="chooseAndSpeak(this.textContent)">---</button>
    <button id="btn2" class="bar answer-bar" onclick="chooseAndSpeak(this.textContent)">---</button>

    <p id="result"></p>

    <button class="bar next-btn" onclick="next()">下一句 ➡️</button>
